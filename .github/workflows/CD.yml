name: MERN CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploye Via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ubuntu }}
          username: ${{secrets.ubuntu}}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: whoami
